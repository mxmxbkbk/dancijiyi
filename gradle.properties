org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# KSP 2.2.10 still registers generated sources through kotlin.sourceSets;
# allow that while AGP's built-in Kotlin integration catches up.
android.disallowKotlinSourceSets=false
kotlin.code.style=official
# Avoid the Kotlin daemon: its client marker lives under the user profile,
# which may be read-only in sandboxed/CI environments.
kotlin.compiler.execution.strategy=in-process
